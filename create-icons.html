<!DOCTYPE html>
<html>
<head>
    <title>PWA 아이콘 생성기</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        .icon-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .icon-item { text-align: center; }
    </style>
</head>
<body>
    <h1>PWA 아이콘 생성기</h1>
    <p>아래 버튼을 클릭하여 각 크기의 아이콘을 다운로드하세요.</p>
    
    <div class="icon-container" id="iconContainer"></div>

    <script>
        const sizes = [192, 512];
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // 배경 그라디언트
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(0.5, '#8b5cf6');
            gradient.addColorStop(1, '#ec4899');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // 둥근 모서리 효과
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            
            // 숫자 아이콘
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('123', size / 2, size / 2);
            
            // 작은 음성 아이콘
            ctx.font = `${size * 0.15}px Arial`;
            ctx.fillText('🔊', size * 0.8, size * 0.2);
            
            return canvas;
        }
        
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // 아이콘 생성 및 표시
        sizes.forEach(size => {
            const canvas = createIcon(size);
            const container = document.createElement('div');
            container.className = 'icon-item';
            
            const label = document.createElement('div');
            label.textContent = `${size}x${size}`;
            
            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = '다운로드';
            downloadBtn.onclick = () => downloadCanvas(canvas, `icon-${size}x${size}.png`);
            
            container.appendChild(canvas);
            container.appendChild(label);
            container.appendChild(downloadBtn);
            
            document.getElementById('iconContainer').appendChild(container);
        });
        
        // 모든 아이콘 다운로드 버튼
        const downloadAllBtn = document.createElement('button');
        downloadAllBtn.textContent = '모든 아이콘 다운로드';
        downloadAllBtn.style.cssText = 'margin: 20px 0; padding: 10px 20px; font-size: 16px; background: #6366f1; color: white; border: none; border-radius: 5px; cursor: pointer;';
        downloadAllBtn.onclick = () => {
            sizes.forEach(size => {
                const canvas = createIcon(size);
                setTimeout(() => {
                    downloadCanvas(canvas, `icon-${size}x${size}.png`);
                }, size); // 약간의 지연으로 브라우저 부하 방지
            });
        };
        
        document.body.insertBefore(downloadAllBtn, document.getElementById('iconContainer'));
    </script>
</body>
</html>
